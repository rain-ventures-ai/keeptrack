name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: tests/browser
        run: npx playwright install chromium
      - name: Playwright split-storage tests
        working-directory: tests/browser
        run: npm test
      - name: Save queue (order, waiting status, failures, timeouts, undo)
        working-directory: tests/browser
        run: node save-queue.test.js
      - name: Mixed kit / board.js version tests
        working-directory: tests/browser
        run: node mixed-versions.test.js
      - name: UI component catalogue and board boot
        working-directory: tests/browser
        run: node ui-catalogue.test.js
      - name: Feedback components (in-page confirm, toasts with Undo, no native dialogs)
        working-directory: tests/browser
        run: node feedback.test.js
      - name: Task drawer
        working-directory: tests/browser
        run: node task-drawer.test.js
      - name: Person, client and project drawers
        working-directory: tests/browser
        run: node crm-drawers.test.js
      - name: Main views on the shared components (tabs, priority/due pills, avatars, popovers)
        working-directory: tests/browser
        run: node views.test.js
      - name: Board-owned Today widgets
        working-directory: tests/browser
        run: node widgets.test.js
      - name: Settings dialog (tabs, section template, deep links, saves, Health, confirms, phone layout)
        working-directory: tests/browser
        run: node settings.test.js
      - name: Alerts (a phone's service-worker fallback, blocked-permission guidance)
        working-directory: tests/browser
        run: node alerts.test.js
      - name: Installable PWA (separate board identities, icons and offline shell)
        working-directory: tests/browser
        run: node pwa.test.js
      - name: Agent limit on the page, routine text, cancelled outcome
        working-directory: tests/browser
        run: node agent-limit.test.js

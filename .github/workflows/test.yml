name: Test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the older run. Pushes to main are never cancelled, so every merge
# commit keeps its own full result.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    # A hung step stops here, not at the 6-hour default (old serial p90 was 12.5 min; parallel runs take about 3).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python unit tests
        # The same files discover finds, one process per file, 4 at a time (ubuntu-latest has 4 CPUs).
        # It fails if any file fails or if fewer tests run than discover loads.
        run: python3 tests/run_parallel.py --jobs 4

  signin:
    runs-on: ubuntu-latest
    # A hung step stops here, not at the 6-hour default (p90 is under 1 min).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sign in with GitHub (Worker and page logic, Node built-ins only)
        run: node --test signin-worker/worker.test.js tests/signin.test.js

  browser:
    runs-on: ubuntu-latest
    # A hung step stops here, not at the 6-hour default (the whole browser job's p90 was 9.3 min).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: tests/browser
        run: npx playwright install chromium
      - name: Playwright split-storage tests
        working-directory: tests/browser
        run: npm test
      - name: Hosted adapter (strict CSP, shared markup and synthetic storage)
        working-directory: tests/browser
        run: node hosted-adapter.test.js
      - name: Save queue (order, waiting status, failures, timeouts, undo)
        working-directory: tests/browser
        run: node save-queue.test.js
      - name: Mixed kit / board.js version tests
        working-directory: tests/browser
        run: node mixed-versions.test.js
      - name: UI component catalogue and board boot
        working-directory: tests/browser
        run: node ui-catalogue.test.js
      - name: Feedback components (in-page confirm, toasts with Undo, no native dialogs)
        working-directory: tests/browser
        run: node feedback.test.js
      - name: Settings dialog (tabs, section template, deep links, saves, Health, confirms, phone layout)
        working-directory: tests/browser
        run: node settings.test.js
      - name: Archive view, People Archived and the remembered Include archive (kit v96)
        working-directory: tests/browser
        run: node archive-view.test.js

  # The browser steps are split over two jobs that run at the same time, about 4.5 minutes each by
  # measured step time. Every step still runs once; none is skipped.
  browser-2:
    runs-on: ubuntu-latest
    # A hung step stops here, not at the 6-hour default (the whole browser job's p90 was 9.3 min).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: tests/browser
        run: npx playwright install chromium
      - name: Archive sizes, lazy reads, bounded shards and hosted revisions
        working-directory: tests/browser
        run: |
          node archive-size.test.js
          node archive-lazy-shards.test.js
          node archive-hosted-revisions.test.js
      - name: Task drawer
        working-directory: tests/browser
        run: node task-drawer.test.js
      - name: Person, client and project drawers
        working-directory: tests/browser
        run: node crm-drawers.test.js
      - name: CRM links (Companies sort and filter, record deep links, source links, project activity)
        working-directory: tests/browser
        run: node crm-links.test.js
      - name: Images on cards (upload, show from the API, refuse fakes, no outside images)
        working-directory: tests/browser
        run: node images.test.js
      - name: Reserved client names on every page save (kit v89)
        working-directory: tests/browser
        run: node reserved-names.test.js
      - name: Main views on the shared components (tabs, priority/due pills, avatars, popovers)
        working-directory: tests/browser
        run: node views.test.js
      - name: Optional Prioritise List (ranking, sorting, conflicts, scroll and mobile)
        working-directory: tests/browser
        run: node prioritise.test.js
      - name: Alerts (a phone's service-worker fallback, blocked-permission guidance)
        working-directory: tests/browser
        run: node alerts.test.js
      - name: Installable PWA (separate board identities, icons and offline shell)
        working-directory: tests/browser
        run: node pwa.test.js
      - name: Agent limit on the page, routine text, cancelled outcome
        working-directory: tests/browser
        run: node agent-limit.test.js
      - name: Board widgets and browser opt-in
        working-directory: tests/browser
        run: node widgets.test.js
      - name: Search help, settings and theme actions
        working-directory: tests/browser
        run: node search-actions.test.js
      - name: Page safety (tab-bound board, min_kit, agent-limit recheck, proposal allow-list, undo cap, settings code, CSP)
        working-directory: tests/browser
        run: node page-safety.test.js
      - name: PRs panel and relay-kit bar
        working-directory: tests/browser
        run: node prs-panel.test.js
      - name: Unread bell (own agents are not news)
        working-directory: tests/browser
        run: node unread-bell.test.js
      - name: Goals bar, Goals sheet, Goal field and filter (kit v83)
        working-directory: tests/browser
        run: node goals.test.js
      - name: Inbound strip for failed and waiting outside items (kit v112)
        working-directory: tests/browser
        run: node inbound-bar.test.js
      - name: Sign in with GitHub (methods, state check, refresh, sign out; fake GitHub and Worker)
        working-directory: tests/browser
        run: node github-signin.test.js
